#{include file="../Header.html"}
<style>
    .layui-layer-page .layui-layer-content {
        position: relative !important;
        overflow: auto !important;
    }
</style>
<!--begin::Content-->
<div class="content d-flex flex-column flex-column-fluid" id="kt_content">
    <!--begin::Toolbar-->
    #{include file="../Toolbar.html"}
    <!--end::Toolbar-->
    <!--begin::Post-->
    <div class="post d-flex flex-column-fluid" id="kt_post">
        <!--begin::Container-->
        <div id="kt_content_container" class="container-fluid">
            <!--begin::Tables Widget 9-->
            <div class="card mb-5 mb-xl-8">
                <!--begin::Header-->
                <div class="card-header border-0 pt-5">
                    <div class="card-toolbar">
                        <button class="btn btn-sm btn-light-primary btn-app-create me-3"><i class="fas fa-plus"></i>
                            新增店铺
                        </button>
                        <button class="btn btn-sm btn-light-danger btn-app-del me-3"><i class="fas fa-trash"></i>
                            移除选中的店铺
                        </button>
                    </div>
                </div>
                <!--end::Header-->

                <div class="card-body py-3">
                    <form class="search-query"></form>
                    <table id="store" lay-filter="store"></table>
                </div>
            </div>

            <!--end::Tables Widget 9-->
        </div>
        <!--end::Container-->
    </div>
    <!--end::Post-->
</div>
<!--end::Content-->

<script>

    $(function () {
        layui.use(['hex'], function () {
            let table = $('#store');
            var cao = layui.hex;

            let queryParams = null;
            table.bootstrapTable({
                url: '/admin/api/store/data',//请求的url地址
                method: "post",//请求方式
                // striped:true,//是否显示行间隔色
                pageSize: 15,//每页显示的数量
                pageList: [15, 25, 50, 100],
                showRefresh: false,//是否显示刷新按钮
                cache: false,//是否使用缓存
                showToggle: false,//是否显示详细视图和列表视图的切换按钮
                cardView: false,
                pagination: true,//是否显示分页
                pageNumber: 1,//初始化显示第几页，默认第1页
                singleSelect: false,//复选框只能选择一条记录
                sidePagination: 'server',//分页显示方式，可以选择客户端和服务端（server|client）
                contentType: "application/x-www-form-urlencoded",//使用post请求时必须加上
                dataType: "json",//接收的数据类型
                queryParamsType: 'limit',//参数格式，发送标准的Restful类型的请求
                queryParams: function (params) {
                    params.page = (params.offset / params.limit) + 1;
                    if (queryParams) {
                        for (const key in params) {
                            queryParams[key] = params[key];
                        }
                    } else {
                        queryParams = params;
                    }
                    return queryParams;
                },
                //回调函数
                responseHandler: function (res) {
                    res.data.forEach(item => {
                        $.post("/admin/api/store/connect", {id: item.id}, run => {
                            let ins = $(".connect-" + item.id);
                            if (run.code == 200) {
                                //success
                                ins.html('<span class="badge badge-light-success">正常</span>');
                                $(".items-" + item.id).show();
                            } else {
                                ins.html('<span class="badge badge-light-danger">' + run.msg + '</span>');
                            }
                        });
                    });

                    return {
                        "total": res.count,
                        "rows": res.data
                    }
                },
                columns: [
                    {checkbox: true}
                    , {
                        field: 'logo', title: 'LOGO', formatter: function (val, item) {
                            return '<span class="badge badge-light-dark"><img src="' + item.domain + '/favicon.ico"  style="width: 30px;border-radius: 100%;"/></span>'
                        }
                    }, {
                        field: 'name', title: '店铺名称', formatter: function (val, item) {
                            return '<span class="badge badge-light">' + item.name + '</span>'
                        }
                    }, {
                        field: 'domain', title: '店铺地址', formatter: function (val, item) {
                            return '<a class="badge badge-light" href="' + item.domain + '" target="_blank">' + item.domain + '</a>'
                        }
                    }, {
                        field: 'balance', title: '余额(缓存)', formatter: function (val, item) {
                            return '<span class="badge badge-light-primary">' + item.balance + '</>'
                        }
                    }, {
                        field: 'status', title: '状态', formatter: function (val, item) {
                            return '<span class="connect-' + item.id + '"><span class="badge badge-light-primary">连接中..</span></span>'
                        }
                    }, {
                        field: 'type', title: '协议', formatter: function (val, item) {
                            if (val == 1) {
                                return '萌次元(V4.0)';
                            }
                            return '异次元(V3.0)';
                        }
                    },
                    {
                        field: 'operate',
                        title: '操作',
                        formatter: function (val, item) {
                            let html = '';
                            html += '<button style="display: none;" type="button" data-id="' + item.id + '" class="btn btn-icon btn-bg-light btn-active-color-success btn-sm me-1 items items-' + item.id + '"><i class="fas fa-plug"></i></button> ';
                            html += '<button type="button" data-id="' + item.id + '" class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1 edit"><i class="fa fa-edit"></i></button> ';
                            html += '<button type="button" data-id="' + item.id + '" class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1 del"><i class="fas fa-trash"></i></button> ';
                            return html;
                        },
                        events: {
                            'click .edit': function (event, value, row, index) {
                                modal(row);
                            },
                            'click .del': function (event, value, row, index) {
                                layer.confirm('您正在移除该店铺，是否要继续？', {
                                    btn: ['确认移除', '取消']
                                }, function () {
                                    $.post('/admin/api/store/del', {list: [row.id]}, res => {
                                        layer.msg(res.msg);
                                        table.bootstrapTable('refresh', {silent: true});
                                    });
                                });
                            },
                            'click .items': function (event, value, mapItem, index) {
  var loaderIndex = layer.load(0, {shade: ['0.3', '#fff']});
  $.post('/admin/api/store/items', {id: mapItem.id}, function (res) {
    layer.close(loaderIndex);

    // 1) 建 id->item 映射
    var itemsMap = {};
    (res.data || []).forEach(function (cat) {
      (cat.children || []).forEach(function (it) {
        itemsMap[it.id] = it;
      });
    });

    // 2) 弹窗
    layui.hex.popup(function (form) {
      if (!form.category_id) { layer.msg("请选择要导入本地的分类"); return; }
      if (!form.auth || !form.auth.length) { layer.msg("请选择至少1个该店铺的商品"); return; }

      // 3) 规范化选中 ID（无论是数组、逗号串、对象都能吃）
      function normalizeIds(input){
        var out = [], seen = {};
        if (Array.isArray(input)) out = input.slice();
        else if (typeof input === 'string') out = input.split(',');
        else if (input && typeof input === 'object') out = Object.keys(input);
        var ids = [];
        for (var i=0;i<out.length;i++){
          var raw = out[i];
          // 兼容 "123" / 123 / "id:123" / "node-123"
          var m = String(raw).match(/(\d+)/);
          var id = m ? parseInt(m[1], 10) : NaN;
          if (id && id>0 && !seen[id]) { seen[id]=1; ids.push(id); }
        }
        return ids;
      }
      var itemIds = normalizeIds(form.auth);
      if (!itemIds.length){ layer.msg("没有有效的商品 ID"); return; }

      // 4) 通用字段
      var common = {
        store_id: mapItem.id,
        category_id: form.category_id,
        shared_sync: form.shared_sync ? 1 : 0,
        inventory_sync: form.inventory_sync ? 1 : 0,
        shelves: form.shelves ? 1 : 0,
        premium_type: form.premium_type,
        premium: form.premium || ''
      };

      // 5) 分批提交（关键：**不要**设置 traditional:true）
      var batchSize = 12;     // 每批 12 个，稳过 max_input_vars
      var idx = 0, ok = 0, fail = 0, total = itemIds.length;
      var loading = layer.load(0, {shade: ['0.3', '#fff']});

      function next(){
        if (idx >= total){
          layer.close(loading);
          layer.closeAll();
          layer.msg('拉取结束，总数量：' + total + '，成功：' + ok + '，失败：' + fail);
          try { $('#store').bootstrapTable('refresh', {silent:true}); } catch(e){}
          return;
        }
        var chunkIds = itemIds.slice(idx, idx + batchSize);
        idx += batchSize;

        // 后端此前“能成功 18 个”的老方案：传 **对象数组** items
        var payload = {
          store_id: common.store_id,
          category_id: common.category_id,
          shared_sync: common.shared_sync,
          inventory_sync: common.inventory_sync,
          shelves: common.shelves,
          premium_type: common.premium_type,
          premium: common.premium,
          items: chunkIds.map(function(id){ return itemsMap[id]; }) // 只要选中的对象
        };

        $.ajax({
          url: '/admin/api/store/addItem?storeId=' + mapItem.id,
          method: 'POST',
          dataType: 'json',
          data: payload
          // 切记：不要加 traditional:true！否则 items 变 "[object Object]"
        }).done(function(run){
          // 尽量宽松地判断成功（按你后端常见返回适配）
          var thisOk = chunkIds.length;
          if (run && (run.code===200 || run.status===1 || run.success===true)) {
            ok += thisOk;
          } else if (run && run.msg && /成功|完成|已入库/.test(run.msg)) {
            ok += thisOk;
          } else {
            fail += thisOk;
          }
          next();
        }).fail(function(){
          fail += chunkIds.length;
          next();
        });
      }
      next();

    }, [
      { title:"本地分类", name:"category_id", type:"select", dict:"category,id,name", placeholder:"请选择分类" },
      { title:"价格主从同步", name:"shared_sync", type:"switch", text:"启用", tips:"开启后，会实时同步价格", default: false },
      { title:"商品数量同步", name:"inventory_sync", type:"switch", text:"启用", tips:"开启后，会进行缓存价格300秒", default: false },
      { title:"立即上架", name:"shelves", type:"switch", text:"立即上架", tips:"开启后，入库完毕后会立即上架", default: false },
      { title:"加价模式", name:"premium_type", type:"radio", dict:[{id:0,name:"普通金额加价"},{id:1,name:"百分比加价"}], default:0 },
      { title:"加价数额", name:"premium", type:"input", placeholder:"加价金额/百分比(小数代替)" },
      { title:"远程商品", name:"auth", type:"treeCheckbox", dict: res.data }
    ], function(){}, [], ['660px','768px'], false, mapItem.name + "-拉取商品到本地分类");
// ---- 强制默认关闭这3个开关（兼容layui.hex默认开启的问题） ----
setTimeout(function(){
  ["shared_sync","inventory_sync","shelves"].forEach(function(name){
    var $el = $("input[name='"+name+"']"); // ✅ 精确选择input
    // 去掉checked属性 + 重置值
    $el.prop("checked", false).removeAttr("checked").val("");
    // 清除layui强制渲染的开关高亮
    var $switch = $el.next(".layui-form-switch");
    if ($switch.length) {
      $switch.removeClass("layui-form-onswitch");
      $switch.find("em").text("启用"); // 恢复文本
    }
  });
  if (layui.form && layui.form.render) layui.form.render('switch'); // ✅ 渲染switch，不是checkbox
}, 300);

  });
}

                        }
                    }
                ]
            });

            let modal = (values = {}) => {
                cao.popup('/admin/api/store/save', [
                    {
                        title: "协议", name: "type", type: "select", placeholder: "请选择协议", dict: [
                            {id: 0, name: "异次元(3.0)"},
                            {id: 1, name: "萌次元(4.0)"}
                        ], default: 0
                    },
                    {
                        title: "店铺地址",
                        name: "domain",
                        type: "input",
                        placeholder: "需要带http://或者https://(推荐,如果支持)"
                    },
                    {title: "商户ID", name: "app_id", type: "input", placeholder: "请输入商户ID"},
                    {title: "商户密钥", name: "app_key", type: "input", placeholder: "请输入商户密钥"},
                ], res => {
                    table.bootstrapTable('refresh', {silent: true});
                }, values);
            }

            $('.btn-app-create').click(function () {
                modal();
            });

            $('.btn-app-del').click(() => {
                let data = cao.listObjectToArray(table.bootstrapTable('getSelections'));
                if (data.length == 0) {
                    layer.msg("请至少勾选1个店铺进行操作！");
                    return;
                }

                layer.confirm('您确定要删除已经选中的店铺吗？这是不可恢复的操作！', {
                    btn: ['确定', '取消']
                }, function () {
                    $.post("/admin/api/store/del", {list: data}, res => {
                        layer.msg(res.msg);
                        table.bootstrapTable('refresh', {silent: true});
                    });
                });
            });

            cao.query('.search-query', table, [
                {title: "店铺名称", name: "search-name", type: "input"},
                {title: "店铺地址", name: "equal-domain", type: "input"}
            ], true, false);
        });
    });
</script>

#{include file="../Footer.html"}
