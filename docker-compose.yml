version: '3.8'

services:
  # PHP-FPM 应用服务
  app:
    build: .
    container_name: acg-faka-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - database
    networks:
      - acg-faka-network
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=acg_faka
      - DB_USER=acg_faka
      - DB_PASSWORD=acg_faka_password
    expose:
      - "9000"

  # Nginx Web 服务器
  web:
    image: nginx:alpine
    container_name: acg-faka-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - acg-faka-network

  # MySQL 数据库服务
  database:
    image: mysql:8.0
    container_name: acg-faka-database
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/database.php:/var/www/html/config/database.php
    environment:
      MYSQL_ROOT_PASSWORD: acg_faka_root_password
      MYSQL_DATABASE: acg_faka
      MYSQL_USER: acg_faka
      MYSQL_PASSWORD: acg_faka_password
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - acg-faka-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uacg_faka", "-pacg_faka_password"]
      timeout: 20s
      retries: 10

  # Redis 缓存服务 (可选)
  redis:
    image: redis:7-alpine
    container_name: acg-faka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - acg-faka-network
    command: redis-server --appendonly yes

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  acg-faka-network:
    driver: bridge